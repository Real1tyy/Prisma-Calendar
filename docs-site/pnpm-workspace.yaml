# Standalone pnpm workspace root for the docs site.
# Scopes this Docusaurus project away from the parent plugin workspace and is
# the supported home for overrides in pnpm v11+ (the package.json "pnpm" field
# is no longer read). Installed WITHOUT --ignore-workspace so these apply.
#
# Every `overrides` floor below clears an advisory reported by
# `mise run deps-security`, pinned WITHIN the installed version's own major
# (see [[decision-deps-audit-fix-within-major-cap]]). All ten */docs-site
# projects carry the identical Docusaurus dependency set, so this file is kept
# byte-identical across them — refresh them together, never one at a time.

# core-js ships only a funding postinstall — explicitly skip it so pnpm v11
# does not abort the frozen CI install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  core-js: false
  core-js-pure: false
overrides:
  '@babel/core@<=7.29.0': '7.29.7'
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3': '7.29.4'
  'ajv@<6.14.0': '6.14.0'
  'ajv@>=7.0.0-alpha.0 <8.18.0': '8.18.0'
  'body-parser@<1.20.6': '1.20.6'
  'brace-expansion@<1.1.17': '1.1.18'
  'fast-uri@<3.1.5': '3.1.5'
  'follow-redirects@<=1.15.11': '1.16.0'
  'http-proxy-middleware@>=0.16.0 <2.0.10': '2.0.10'
  'joi@<17.13.4': '17.13.4'
  'js-yaml@<3.15.0': '3.15.0'
  'js-yaml@>=4.0.0 <4.3.0': '4.3.0'
  'launch-editor@<=2.14.0': '2.14.1'
  'lodash@<=4.17.23': '4.18.1'
  'mdast-util-to-hast@>=13.0.0 <13.2.1': '13.2.1'
  'minimatch@<3.1.4': '3.1.4'
  'node-forge@<1.4.0': '1.4.0'
  'path-to-regexp@<0.1.13': '0.1.13'
  'picomatch@<2.3.2': '2.3.2'
  'postcss@<8.5.18': '8.5.24'
  'qs@<6.14.2': '6.14.2'
  'serialize-javascript@<7.0.5': '7.0.5'
  'shell-quote@<=1.8.4': '1.10.0'
  'svgo@>=3.0.0 <3.3.4': '3.3.4'
  'undici@>=7.0.0 <7.28.0': '7.29.0'
  'webpack@>=5.49.0 <=5.104.0': '5.104.1'
  'webpack-dev-server@<=5.2.5': '5.2.6'
  'websocket-driver@<0.7.5': '0.7.5'
  'ws@>=7.0.0 <7.5.11': '7.5.13'
  'ws@>=8.0.0 <8.21.0': '8.21.1'

# uuid@8.3.2 (GHSA-w5hq-g745-h8pq, MODERATE) is deliberately NOT pinned. The
# advisory's only patched line is >=11.1.1 — three majors up — and uuid dropped
# its callable default export in v7, so forcing it is exactly the cross-major
# breakage [[decision-deps-audit-fix-within-major-cap]] exists to prevent. It
# sits below the --fail-on=high release threshold; revisit if uuid backports a
# bounds check to 8.x, or when Docusaurus stops depending on uuid@8.

# A security floor must not wait out pnpm's new-release quarantine — these
# versions are pinned *because* they are the fix.
minimumReleaseAgeExclude:
  - '@babel/core@7.29.7'
  - body-parser@1.20.6
  - brace-expansion@1.1.18
  - fast-uri@3.1.5
  - http-proxy-middleware@2.0.10
  - joi@17.13.4
  - launch-editor@2.14.1
  - postcss@8.5.24
  - webpack-dev-server@5.2.6
